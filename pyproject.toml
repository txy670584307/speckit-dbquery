[project]
name = "db-query"
version = "0.1.0"
description = "数据库查询工具 - 连接管理、metadata 浏览、SQL 查询、自然语言生成 SQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlglot>=26.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "psycopg>=3.2.0",
    "psycopg-binary>=3.2.0",
    "asyncpg>=0.31.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
